# aleph-next — committed defaults. No secrets: use ${ENV_VAR} references only.
# Per-host overrides go in config/hosts/<hostname>.toml (gitignored).
# See docs/design/phase-1.md §9 for the full surface.

runner = "sdk"

[daemon]
data_dir = "./data"
vault_dir = "./vault"
socket = "./data/aleph.sock"
shutdown_grace_seconds = 120
timezone = "America/Los_Angeles"
tick_seconds = 30

[telegram]
# Fully-populated example. Values are ${ENV} references; real values live in .env,
# read by the supervisor (compose/systemd), never by agent-reachable code.
enabled = true
api_base = "https://api.telegram.org"
bot_token = "${TELEGRAM_BOT_TOKEN}"
chat_id = "${TELEGRAM_CHAT_ID}"
owner_user_id = "${TELEGRAM_OWNER_ID}"
poll_timeout_seconds = 50

[obs]
enabled = true
otlp_endpoint = "http://127.0.0.1:3010/api/public/otel/v1/traces"
langfuse_base_url = "http://127.0.0.1:3010"
langfuse_project_id = "${LANGFUSE_PROJECT_ID}"
service_name = "aleph-daemon"
export_timeout_ms = 5000

[sessions]
resume_window_hours = 24
idle_hours = 24
archive_days = 7
checkpoint_every_turns = 5
max_active_topics = 6

[meter]
plan = "max20x"

[meter.reserve]
window_5h = 0.30
weekly = 0.25

# Capacity is an ESTIMATE in weighted tokens, calibrated from observed
# meter.window_exhausted events. See docs/design/phase-1.md §11.1.
[meter.capacity]
window_5h = 4000000
weekly = 40000000

[meter.weights]
input = 1
output = 5
cache_read = 0.1
cache_creation = 1.25

[lanes.interactive]
enabled = true
max_concurrent = 2
max_queue = 32

[lanes.control]
enabled = true
max_concurrent = 2
max_queue = 32

[lanes.librarian]
enabled = true
max_concurrent = 1
max_queue = 8

[lanes.heartbeat]
enabled = true
max_concurrent = 1
max_queue = 4

[lanes.research]
enabled = true
max_concurrent = 1
max_queue = 8

[lanes.synthesis]
enabled = true
max_concurrent = 1
max_queue = 8

# The largest silent consumer (design v1.0 §2). Enable deliberately, never by default.
[lanes.backlog]
enabled = false
max_concurrent = 1
max_queue = 8

[routing]
default_tier = "T2"
flex = 1
escalate_after_failures = 2

[routing.tiers]
# T0 (daemon-box CPU, private) and T0g (Modal L40S) are named but not wired in Phase 1.
T0  = { model = "local/qwen3-8b",                enabled = false, backend = "local" }
T0g = { model = "modal/qwen3-30b",               enabled = false, backend = "modal" }
T1  = { model = "claude-haiku-4-5-20251001",     enabled = true }
T2  = { model = "claude-sonnet-5",               enabled = true }
T3  = { model = "claude-opus-5",                 enabled = true }

[routing.classes]
conversation = { tier = "T2", ceiling = "T3" }
classify     = { tier = "T1", ceiling = "T1" }
brief        = { tier = "T1", ceiling = "T2" }
orchestrate  = { tier = "T3", ceiling = "T3" }

[vault]
memory_max_lines = 150
commit_per_write = ["wiki/", "MEMORY.md", "index.md"]

[retention]
compress_after_days = 30

[obs.otlp_headers]
Authorization = "${LANGFUSE_OTLP_AUTH}"
