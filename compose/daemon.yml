# The daemon itself, in a container. Brought up and verified 2026-08-21 with
# runner = "echo"; see docs/RUNBOOK-phase1-slice.md. The SDK runner needs a
# credential in the container (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY) and
# has not been run this way.
#
# The ro/rw split below is the Phase 1 half of the mount plan in
# docs/design/phase-1.md §10.3: enforcement lives at the mount, and the daemon's
# own path checks are defence in depth, not the gate.
name: aleph

services:
  daemon:
    build: ..
    # Never root: the Agent SDK refuses bypassPermissions as root, and the
    # vault's read-only mounts are meaningless to a process that can remount.
    # The uid must also match the owner of the bind-mounted vault, or every
    # write fails with EACCES — `ALEPH_UID=$(id -u) ALEPH_GID=$(id -g)`.
    user: "${ALEPH_UID:-1000}:${ALEPH_GID:-1000}"
    hostname: aleph-daemon
    environment:
      ALEPH_CONFIG: /app/config/aleph.toml
      ALEPH_GIT_SHA: ${ALEPH_GIT_SHA:-unknown}
      # The committed config carries host paths; container paths come from the
      # ALEPH_*__* overrides rather than a second copy of the file that can drift.
      ALEPH_DAEMON__DATA_DIR: /app/data
      ALEPH_DAEMON__VAULT_DIR: /vault
      ALEPH_DAEMON__SOCKET: /app/data/aleph.sock
      # 127.0.0.1 inside the container is the container, and host.docker.internal
      # reaches the host's bridge address — where a loopback-bound Langfuse is not
      # listening. Reach it over the compose network instead, by service name.
      # The base URL stays a host URL: it is for deep links a human clicks.
      ALEPH_OBS__OTLP_ENDPOINT: http://langfuse-web:3000/api/public/otel/v1/traces
      # The committed config carries no ingestion key — an unresolved ${VAR} is a
      # boot failure, and a host without Langfuse must still boot. The header is
      # supplied here instead, where the supervisor already holds the secret.
      ALEPH_OBS__OTLP_HEADERS__AUTHORIZATION: ${LANGFUSE_OTLP_AUTH}
      # Deep links are for a human on the host, so this stays a host URL while
      # ingestion goes over the compose network.
      ALEPH_OBS__LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID}
      ALEPH_RUNNER: ${ALEPH_RUNNER:-sdk}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The runtime uid has no passwd entry, so HOME would be "/" and unwritable.
      # The Agent SDK keeps its session transcript under $HOME/.claude: without
      # this the first turn answers and every resume fails. It lives in the data
      # volume so transcripts survive `up --force-recreate`.
      HOME: /app/data/home
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID}
      LANGFUSE_OTLP_AUTH: ${LANGFUSE_OTLP_AUTH}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID}
    volumes:
      - ../config:/app/config:ro                    # protected core
      - aleph-data:/app/data                        # db, event log, socket
      # The vault root is mounted rw and the two protected paths are re-mounted
      # ro on top of it. Mounting only the rw subdirectories — the first shape
      # this file had — leaves /vault itself an implicit root-owned directory,
      # and git refuses to operate in a worktree it does not own ("dubious
      # ownership"), so the vault silently keeps no history.
      - ${ALEPH_VAULT:-../vault}:/vault
      - ${ALEPH_VAULT:-../vault}/human:/vault/human:ro     # Chris's notes
      - ${ALEPH_VAULT:-../vault}/VAULT.md:/vault/VAULT.md:ro
    # Loopback + tailnet only. No published ports: the CLI reaches the daemon
    # over the Unix socket in the data volume.
    networks: [default, langfuse]
    restart: unless-stopped
    stop_grace_period: 150s

networks:
  default:
  # Created by compose/langfuse.yml. Bring that up first; the daemon runs without
  # it only if obs.enabled is false.
  langfuse:
    external: true
    name: aleph-langfuse_default

volumes:
  aleph-data:
