name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The tests make commits in temp repos, so git needs an identity.
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The firefighter quotes this line in a CI issue: a failure that depends on the core count can then be reproduced.
      # --bail=3 stops a red run after the third failing test; the firefighter still gets 3 (fail) lines to group by.
      - run: 'echo "runner cores: $(nproc)" && bun run test:all --bail=3'
