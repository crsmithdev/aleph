name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The Hooks page's change note reads the git log of a hook's entry file, so it needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # The tests make commits in temp repos, so git needs an identity.
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # aleph-tools is private: its read-only deploy key lets git clone it.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALEPH_TOOLS_DEPLOY_KEY }}
      # aleph loads aleph-tools by path (ui/kit.ts), at the commit named in ALEPH_TOOLS_REF.
      - run: |
          git clone git@github.com:crsmithdev/aleph-tools.git "$RUNNER_TEMP/aleph-tools"
          git -C "$RUNNER_TEMP/aleph-tools" checkout "$(cat ALEPH_TOOLS_REF)"
          echo "ALEPH_TOOLS=$RUNNER_TEMP/aleph-tools" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The firefighter quotes this line in a CI issue: a failure that depends on the core count can then be reproduced.
      # --bail=3 stops a red run after the third failing test; the firefighter still gets 3 (fail) lines to group by.
      - run: 'echo "runner cores: $(nproc)" && bun run test:all --bail=3'
