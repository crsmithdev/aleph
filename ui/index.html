<body>
<div class="shell">
  <nav class="side" aria-label="Views">
    <a class="mark" href="#/">
      <!-- The small aleph mark: the outer circle and the point. The full mark has a third circle between them, too fine at this size. -->
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="12"/>
        <circle cx="35.5" cy="64.5" r="20" fill="currentColor"/>
      </svg>aleph</a>
    <div id="nav"></div>
    <a id="logout" href="#" title="Log out" hidden><wa-icon name="right-from-bracket" aria-hidden="true"></wa-icon><span class="lbl">Log out</span></a>
    <button id="collapse" type="button" aria-label="Collapse the sidebar" aria-expanded="true">&lt;&lt;</button>
  </nav>
  <main>
    <p id="offline" role="alert" hidden>The server is unreachable. Showing the last data.</p>
    <p id="stale" role="alert" hidden>The server runs older code than the checkout. Restart it: <code>systemctl --user restart aleph-ui</code></p>
    <div id="view"></div>
  </main>
</div>
<script>
  // A classic script, so that a collapsed sidebar is collapsed before the first paint.
  {
    const KEY = "aleph-sidebar-collapsed";
    const shell = document.querySelector(".shell"), button = document.getElementById("collapse");
    const show = (collapsed) => {
      shell.classList.toggle("collapsed", collapsed);
      button.textContent = collapsed ? ">>" : "<<";
      button.setAttribute("aria-label", collapsed ? "Expand the sidebar" : "Collapse the sidebar");
      button.setAttribute("aria-expanded", String(!collapsed));
    };
    try { show(localStorage.getItem(KEY) === "1"); } catch {}
    button.addEventListener("click", () => {
      const collapsed = !shell.classList.contains("collapsed");
      show(collapsed);
      try { localStorage.setItem(KEY, collapsed ? "1" : "0"); } catch {}
    });
  }
</script>

<p class="sr" role="status" aria-live="polite" id="copied"></p>
<script type="module">
  import { actMessages, denyReasons, diffHtml, elapsed, empty, error, esc, failMessage, loading, loadingLine, mountView, openDiffs, parseHash, recordState, restoreState } from "/lib.js";

  // The shell. Each module listed by /api/views exports
  // view = { path, title, group, order, icon?, render(data, params), mount?(root, data), api?, refresh?, live? }, and
  // may export redirect(hash) -> new hash | null for an address it took over:
  // `api` is the URL its data comes from (":params" filled in from the route),
  // `refresh` the seconds between reloads, `live` that /api/events also reloads it,
  // `icon` its sidebar glyph, a Font Awesome name. The page builds the sidebar from
  // them, in GROUPS order under the HEADERS, and routes by hash (#/jobs/aleph-52).
  const GROUPS = ["factory", "claude"], HEADERS = { factory: "Factory", claude: "Claude" };
  const $ = (id) => document.getElementById(id);
  let views = [], redirects = [], timer = 0, shown = null;

  function compile(path) {
    const names = [];
    const src = path.split("/").map((seg) => seg.startsWith(":") ? (names.push(seg.slice(1)), "([^/]+)") : seg.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("/");
    return { re: new RegExp(`^${src}/?$`), names };
  }
  const readHash = () => parseHash(location.hash);
  // A hand-typed `%zz` is no encoding: it stands for itself, and the view says it found nothing.
  const decodeParam = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
  function match(path, query) {
    for (const v of views) {
      const m = path.match(v._route.re);
      if (m) return { view: v, query, params: Object.fromEntries(v._route.names.map((n, i) => [n, decodeParam(m[i + 1])])) };
    }
    return null;
  }
  // The page imports each view once; when the server restarts or a land changes a page file (the version header changes), reload to load it, unless the reader is typing.
  let version = null;
  async function api(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (res.status === 401) { location.reload(); return res; }
    if (res.headers.get("x-aleph-login") === "1") $("logout").hidden = false;
    $("stale").hidden = res.headers.get("x-aleph-stale") !== "1";
    const v = res.headers.get("x-aleph-version");
    if (v && version && v !== version && !document.activeElement?.matches("input, textarea, select")) location.reload();
    if (v && !version) version = v;
    return res;
  }

  $("logout").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/api/logout", { method: "POST", headers: { "X-Aleph-UI": "1" } }).catch(() => {});
    location.reload();
  });

  function nav(path) {
    // The entry whose path is the longest segment prefix of the route is active: #/jobs/x marks Jobs.
    let active = null;
    for (const v of views) {
      if (v.path.includes(":")) continue;
      const hit = v.path === "/" ? path === "/" : path === v.path || path.startsWith(v.path + "/");
      if (hit && (!active || v.path.length > active.path.length)) active = v;
    }
    const items = views.filter((v) => GROUPS.includes(v.group) && !v.path.includes(":") && v.nav !== false).sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) || (a.order ?? 0) - (b.order ?? 0) || a.title.localeCompare(b.title));
    $("nav").innerHTML = `<ul>${items.map((v, i) =>
      `${v.group !== items[i - 1]?.group && HEADERS[v.group] ? `<li class="head">${HEADERS[v.group]}</li>` : ""}<li><a href="#${esc(v.path)}" title="${esc(v.title)}"${v === active ? ' aria-current="page"' : ""}><wa-icon name="${esc(v.icon)}" aria-hidden="true"></wa-icon><span class="lbl">${esc(v.title)}</span></a></li>`).join("")}</ul>`;
  }

  // Out-of-date check for a view with `outOfDate`: the browser's clock, from the last good response (or the route's start).
  let goodAt = Date.now(), failed = false, wasOut = false;
  function checkOut() {
    const v = shown?.view;
    if (!v?.outOfDate) return;
    const out = failed || Date.now() - goodAt > 3 * 60 * 1000;
    if (out !== wasOut) { wasOut = out; v.outOfDate($("view"), out); }
  }

  async function load(route, first) {
    const { view, params, query } = route;
    let data = null;
    if (view.api) {
      const url = typeof view.api === "function" ? view.api(params, query) : view.api.replace(/:(\w+)/g, (_, n) => encodeURIComponent(params[n] ?? ""));
      try {
        const res = await api(url);
        if (!res.ok) throw new Error(failMessage(url, res.status, await res.text().catch(() => "")));
        data = await res.json();
        $("offline").hidden = true;
        if (route === shown) { goodAt = Date.now(); failed = false; }
      } catch (e) {
        if (route !== shown) return;
        failed = true;
        checkOut();
        if (first) $("view").innerHTML = `<div class="page">${error(`Could not load ${view.title}: ${e.message}`)}</div>`;
        else $("offline").hidden = false;
        return;
      }
    }
    if (route !== shown) return;  // the reader moved on while this loaded
    // The reader armed a button while this loaded: the caller's check came too early, and the next refresh catches up.
    if (!first && $("view").querySelector("button.act.ask")) return;
    // A refresh render throws away what the reader set (open folds, shown diffs, typed text); put it back.
    const saved = first ? null : recordState($("view"));
    // Keyed <details> also keep their open state by data-keep.
    const kept = new Map();
    if (!first) $("view").querySelectorAll("details[data-keep]").forEach((d) => kept.set(d.dataset.keep, d.open));
    try { $("view").innerHTML = view.render(data, params, query); }
    catch (e) { $("view").innerHTML = `<div class="page">${error(`${view.title} failed to render: ${e.message}`, "This is a bug in the view.")}</div>`; return; }
    if (saved) restoreState($("view"), saved);
    $("view").querySelectorAll("details[data-keep]").forEach((d) => { if (kept.has(d.dataset.keep)) d.open = kept.get(d.dataset.keep); });
    // `mount` runs after render, for what needs a DOM (the charts); a view without one is left alone.
    try { mountView(view, $("view"), data, query); }
    catch (e) { console.error(view.title, "mount failed", e); }
    // A good response clears the alert.
    wasOut = false;
    if (view.outOfDate) view.outOfDate($("view"), false);
  }

  // One reload at a time; events that come during it make one more. A push does not re-render while the reader types or has a button armed; `refresh` catches up, except over an armed button, which stands for five seconds at most.
  let reloading = false, again = false;
  async function reload() {
    if (reloading) { again = true; return; }
    if (!shown?.view?.live || document.activeElement?.matches("input, textarea, select") || $("view").querySelector("button.act.ask")) return;
    reloading = true;
    try { await load(shown, false); } finally { reloading = false; }
    if (again) { again = false; reload(); }
  }

  // The stream is open only for a live view in a visible tab: a browser allows few connections to one host.
  let events = null;
  function follow() {
    events?.close();
    events = null;
    if (!shown?.view?.live || document.hidden) return;
    let lost = false;
    events = new EventSource("/api/events");
    events.addEventListener("change", reload);
    events.onerror = () => { lost = true; };
    events.onopen = () => { if (lost) reload(); };
  }
  document.addEventListener("visibilitychange", () => { follow(); if (!document.hidden) reload(); });

  function route() {
    // A view may take over an old address (a view exports `redirect(hash)`).
    for (const r of redirects) {
      const to = r(location.hash);
      if (to) { history.replaceState(null, "", to); break; }
    }
    const { path, query } = readHash();
    nav(path);
    clearInterval(timer);
    // #view outlives its views, so a view's handlers on it must not reach the next one.
    $("view").onclick = $("view").onchange = $("view").onkeydown = null;
    const m = match(path, query);
    shown = m ?? { view: null };
    follow();
    if (!m) {
      document.title = "Not found · aleph";
      $("view").innerHTML = `<div class="page nf"><h1>Nothing at ${esc(path)}</h1>${empty("No view has this address.", `Go to <a href="#/">Status</a> or pick a view from the list.`)}</div>`;
      $("offline").hidden = true;
      return;
    }
    document.title = `${m.view.title} · aleph`;
    $("view").innerHTML = loading(m.view.title);
    goodAt = Date.now(); failed = false; wasOut = false;
    load(shown, true);
    if (m.view.refresh) timer = setInterval(() => { if (!$("view").querySelector("button.act.ask")) load(m, false); }, m.view.refresh * 1000);
  }

  // Elapsed times tick every second between refreshes: m:ss since the element's data-since.
  setInterval(() => {
    checkOut();
    document.querySelectorAll("#view .elapsed[data-since]").forEach((el) => {
      el.textContent = elapsed(el.dataset.since, new Date().toISOString());
    });
  }, 1000);

  // In-page anchors (#needs) scroll to their element instead of routing.
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || a.getAttribute("href").startsWith("#/")) return;
    const el = document.getElementById(a.getAttribute("href").slice(1));
    e.preventDefault();
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  // Copy a command to the clipboard; fall back to selecting it. One handler,
  // because the buttons are rebuilt on every refresh.
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest(".cmd[data-cmd]");
    if (!b) return;
    const cp = b.querySelector(".cp"), text = b.dataset.cmd;
    const done = (ok) => {
      if (!ok) {
        const rg = document.createRange(); rg.selectNodeContents(b.firstElementChild);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      }
      cp.textContent = ok ? "Copied" : "Press Ctrl+C";
      b.classList.add("copied");
      $("copied").textContent = (ok ? "Copied: " : "Selected: ") + text;
      clearTimeout(b._t);
      b._t = setTimeout(() => { cp.textContent = "Copy"; b.classList.remove("copied"); }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
    else done(false);
  });

  document.addEventListener("input", (e) => {
    const f = e.target.closest && e.target.closest("input.reason[data-id]");
    if (f) f.value ? denyReasons.set(`${f.dataset.repo}-${f.dataset.id}`, f.value) : denyReasons.delete(`${f.dataset.repo}-${f.dataset.id}`);
  });

  // Enter in a reason or answer box does what the box's Confirm button does.
  document.addEventListener("keydown", (e) => {
    const f = e.key === "Enter" && e.target.closest && e.target.closest("input.reason");
    if (!f) return;
    e.preventDefault();
    f.closest(".choice")?.querySelector("button.act[data-act]")?.click();
  });

  // Diff, Land, Drop and Checked: each is an `aleph` command the server runs.
  // Land and Drop ask for a second click, then the view reloads.
  document.addEventListener("click", async (e) => {
    const b = e.target.closest && e.target.closest("button.act[data-act]");
    if (!b) return;
    const { act, label } = b.dataset;
    const name = b.dataset.name ?? (act === "approve" || act === "decline" ? b.dataset.id : undefined);
    const note = (m) => { let n = b.parentElement.querySelector(".act-msg"); if (!n) { n = document.createElement("span"); n.className = "act-msg"; n.setAttribute("role", "alert"); b.parentElement.append(n); } n.textContent = m; if (name) actMessages.set(name, m); };
    if (act === "diff") {
      const panel = b.closest("article").querySelector(".diff-panel");
      if (!panel.hidden) { panel.hidden = true; openDiffs.delete(name); return; }
      panel.hidden = false;
      openDiffs.set(name, "");
      panel.innerHTML = loadingLine("diff");
      try {
        const res = await fetch(`/api/diff/${encodeURIComponent(name)}`, { cache: "no-store" });
        const t = await res.text();
        panel.innerHTML = res.ok ? diffHtml(t) : error(t, "Reload the page to try again.");
        if (res.ok) openDiffs.set(name, t); else openDiffs.delete(name);
      } catch (err) { openDiffs.delete(name); panel.innerHTML = error(err.message, "Reload the page to try again."); }
      return;
    }
    if ((act === "deny" || act === "answer") && !b.classList.contains("ask")) {
      const inp = b.closest(".choice")?.querySelector("input.reason");
      if (inp?.hidden) {
        inp.hidden = false;
        b.classList.add("ask");
        b.textContent = "Confirm";
        inp.focus();
        return;
      }
    }
    const answerText = act === "answer" ? b.closest(".actions").querySelector("input[name=answer]")?.value.trim() ?? "" : "";
    if (act === "answer" && !answerText) { note("Type an answer first"); return; }
    if (((act === "land" && !b.closest(".choice")) || act === "drop" || act === "pause" || ((act === "deny" || act === "answer") && !b.closest(".choice")?.querySelector("input.reason"))) && !b.classList.contains("ask")) {
      b.classList.add("ask");
      b.textContent = name ? `${label} ${name}? Click again` : `${label}? Click again`;
      clearTimeout(b._t);
      b._t = setTimeout(() => { b.classList.remove("ask"); b.textContent = label; }, 5000);
      return;
    }
    clearTimeout(b._t);
    const post = (url, body) => fetch(url, { method: "POST", headers: { "X-Aleph-UI": "1", "content-type": "application/json" }, body: JSON.stringify(body) });
    if (act === "always") {
      // Grant the standing permission, then click the row's first action (its second-click confirm applies).
      const { reason, action, first } = b.dataset;
      b.disabled = true;
      try {
        const res = await post(`/api/standing/${encodeURIComponent(reason)}`, { action });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || res.statusText);
      } catch (err) { b.disabled = false; note(`${act} failed: ${err.message}`); return; }
      const next = [...b.closest("article").querySelectorAll("button.act:not(.always)")].find((x) => x.dataset.act === first);
      b.disabled = false;
      if (next) { next.click(); return; }
      if (shown) load(shown, false);
      return;
    }
    if (act === "retriage" || act === "unblock" || act === "rerun" || act === "checked" || act === "close" || (act === "drop" && b.dataset.repo)) {
      const { repo, id } = b.dataset;
      b.disabled = true;
      try {
        const res = await post(`/api/issues/${encodeURIComponent(repo)}/${encodeURIComponent(id)}/${act === "close" ? "drop" : act}`, act === "close" ? { reason: "Chris closed it" } : {});
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || res.statusText);
      } catch (err) { b.disabled = false; note(`${act} failed: ${err.message}`); return; }
      b.closest("article.issue-row")?.remove();
      if (shown) load(shown, false);
      return;
    }
    if (act === "decide" || act === "deny") {
      // A Decide row: approve one option, or deny with the reason typed beside the button.
      const { repo, id, option, recommendation, approve } = b.dataset;
      const reason = b.closest(".actions").querySelector("input.reason")?.value.trim() ?? "";
      const bs = [...b.closest(".actions").querySelectorAll("button.act")];
      bs.forEach((x) => { x.disabled = true; });
      try {
        const res = await fetch(`/api/issues/${encodeURIComponent(repo)}/${encodeURIComponent(id)}/${act === "deny" ? "drop" : "decide"}`, { method: "POST", headers: { "X-Aleph-UI": "1", "content-type": "application/json" },
          body: JSON.stringify(act === "deny" ? { reason: reason ? `Chris denied: ${reason}` : "Chris denied it" } : approve ? { approve: true } : recommendation ? { recommendation: true } : { label: option }) });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || res.statusText);
        denyReasons.delete(`${repo}-${id}`);
      } catch (err) { bs.forEach((x) => { x.disabled = false; x.classList.remove("ask"); x.textContent = x.dataset.label; }); note(`${act} failed: ${err.message}`); return; }
      b.closest("article.issue-row")?.remove();
      if (shown) load(shown, false);
      return;
    }
    b.disabled = true;
    if (name) actMessages.delete(name);
    try {
      const res = await fetch(name ? `/api/${act}/${encodeURIComponent(name)}` : `/api/${act}`, { method: "POST", headers: { "X-Aleph-UI": "1", "content-type": "application/json" }, body: JSON.stringify(act === "answer" ? { answer: answerText } : act === "wait" ? { on: b.dataset.on } : {}) });
      const r = await res.json().catch(() => ({ code: res.status, stderr: res.statusText }));
      if (r.code !== 0) { b.disabled = false; b.classList.remove("ask"); b.textContent = label; note(`${act} failed: ${(r.error || r.stderr || r.stdout || `code ${r.code}`).trim().split("\n").pop()}`); return; }
    } catch (err) { b.disabled = false; note(err.message); return; }
    b.closest("article.issue-row")?.remove();
    if (shown) load(shown, false);
  });

  async function start() {
    const names = await fetch("/api/views", { cache: "no-store" }).then((r) => r.json()).catch(() => []);
    const mods = await Promise.all(names.map((n) => import(`/views/${n}`).then((m) => (typeof m.redirect === "function" && redirects.push(m.redirect), m.view), (e) => { console.error(n, e); return null; })));
    views = mods.filter((v) => v && typeof v.path === "string" && typeof v.render === "function")
      .map((v) => ({ ...v, _route: compile(v.path) }));
    addEventListener("hashchange", route);
    route();
  }
  start();
</script>
<!-- TEMPORARY font picker: Chris chooses the fonts, then this block goes. -->
<script type="module">
  const byName = (a) => a.sort((x, y) => x.localeCompare(y));
  const SANS = byName(["Work Sans", "Inter", "Roboto", "Open Sans", "Montserrat", "Lato", "Poppins", "Nunito Sans", "Source Sans 3", "Raleway",
    "Noto Sans", "Rubik", "DM Sans", "Manrope", "IBM Plex Sans", "Figtree", "Outfit", "Plus Jakarta Sans", "Lexend", "Barlow"]);
  const SERIF = byName(["Merriweather", "Playfair Display", "Lora", "Roboto Slab", "PT Serif", "Libre Baskerville", "Source Serif 4", "Noto Serif",
    "EB Garamond", "Crimson Pro", "Fraunces", "DM Serif Display", "Bitter", "Cormorant Garamond", "Spectral"]);
  const MONO = byName(["Hack Nerd Font", "JetBrains Mono", "Fira Code", "IBM Plex Mono", "Roboto Mono", "Source Code Pro", "Space Mono",
    "Ubuntu Mono", "Inconsolata", "DM Mono", "Red Hat Mono", "Geist Mono"]);
  const TYPES = [["Serif", SERIF], ["Sans", SANS], ["Mono", MONO]];
  const LOCAL = new Set(["Hack Nerd Font"]);
  const ROLES = [
    ["display", "Titles", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"],
    ["metric", "Big numbers", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"],
    ["sans", "Text", SANS, "Work Sans", "system-ui, sans-serif"],
    ["num", "Numbers", [...SANS, ...MONO], "", "system-ui, sans-serif"],
    ["mono", "Code", MONO, "Hack Nerd Font", "ui-monospace, monospace"],
    ["brand", "Logo", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"],
    ["chart", "Charts", [...SANS, ...MONO], "", "system-ui, sans-serif"],
  ];
  // Relative steps, not sizes. The first entry of each is its default; spacing is letter spacing in em. A canvas has no letter spacing, so Charts has none, and ECharts reads its tokens when it draws, at the next 15-second refresh.
  const STEPS = {
    size: ["Size", [["Smaller", 0.85], ["Small", 0.92], ["Large", 1.08], ["Larger", 1.18]]],
    weight: ["Weight", [["Lighter", -200], ["Light", -100], ["Heavy", 100], ["Heavier", 200]]],
    spacing: ["Spacing", [["Tighter", -0.02], ["Tight", -0.01], ["Wide", 0.02], ["Wider", 0.05]]],
  };
  const KEY = "aleph-fonts";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
  const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
  const loaded = new Set();
  // Ask for five weights; a family without them gets a plain request instead.
  function load(family) {
    if (!family || LOCAL.has(family) || loaded.has(family)) return;
    loaded.add(family);
    const q = family.replaceAll(" ", "+");
    const link = Object.assign(document.createElement("link"), { rel: "stylesheet", href: `https://fonts.googleapis.com/css2?family=${q}:wght@300;400;500;600;700&display=swap` });
    link.onerror = () => { link.href = `https://fonts.googleapis.com/css2?family=${q}&display=swap`; link.onerror = null; };
    document.head.append(link);
  }
  const chosen = read();
  const step = (role, prop) => { const v = chosen[`${role}:${prop}`]; return v === undefined ? (prop === "size" ? 1 : 0) : Number(v); };
  // Each rule of the page's stylesheet, with the role whose text it styles. A rule that names no family counts as Text.
  // This reads the source: CSSOM gives an empty `font` for a var() shorthand that a longhand follows.
  function scan(source) {
    const out = [];
    let media = "";
    for (const [, at, selector, body] of source.replace(/\/\*[\s\S]*?\*\//g, "").matchAll(/(@media[^{]+)\{|([^{}]+)\{([^{}]*)\}|\}/g)) {
      if (at) { media = at.trim(); continue; }
      if (!selector) { media = ""; continue; }
      const get = (prop) => body.match(new RegExp(`(?:^|;)\\s*${prop}:\\s*([^;]+)`))?.[1].trim() ?? "";
      const font = get("font"), family = get("font-family");
      const role = ROLES.find(([x]) => `${font} ${family}`.includes(`var(--${x})`))?.[0];
      const m = font.match(/^(?:(\d{3})\s+)?(\S+?)(?:\/\S+)?\s/);
      const size = m?.[2] || get("font-size"), spacing = get("letter-spacing");
      out.push({ selector: selector.trim(), media, role: role ?? "sans", bound: Boolean(role), size: /px$|var\(--fs/.test(size) ? size : "",
        weight: Number(m?.[1] || get("font-weight")) || 0, spacing: /em$/.test(spacing) ? spacing : "" });
    }
    return out;
  }
  const adjusted = document.createElement("style");
  // The page's stylesheet is app.css, not a <style>: the picker's own element is the first one. Fetched once; apply() runs again when it arrives.
  let rules = null;
  fetch("/app.css").then((r) => r.text()).then((t) => { rules = scan(t); apply(); });
  function apply() {
    for (const [role, , , def, fallback] of ROLES) {
      const f = chosen[role];
      if (f || chosen[`${role}:weight`]) load(f || def);
      if (f) document.documentElement.style.setProperty(`--${role}`, `'${f}', ${fallback}`);
      else document.documentElement.style.removeProperty(`--${role}`);
    }
    document.documentElement.style.setProperty("--chart-scale", step("chart", "size"));
    document.documentElement.style.setProperty("--chart-weight", 400 + step("chart", "weight"));
    adjusted.textContent = (rules ?? []).map((r) => {
      const s = step(r.role, "size"), w = step(r.role, "weight"), sp = step(r.role, "spacing");
      const out = [];
      if (s !== 1 && r.size) out.push(`font-size: calc(${r.size} * ${s})`);
      if (w && (r.weight || r.bound)) out.push(`font-weight: ${Math.min(900, Math.max(100, (r.weight || 400) + w))}`);
      if (sp && (r.spacing || r.bound)) out.push(`letter-spacing: calc(${r.spacing || "0em"} + ${sp}em)`);
      if (!out.length) return "";
      const rule = `${r.selector} { ${out.join("; ")}; }`;
      return r.media ? `${r.media} { ${rule} }` : rule;
    }).filter(Boolean).join("\n");
    css.textContent = ROLES.flatMap(([r, label, , , fb]) => [
      ...(chosen[r] ? [`--${r}: '${chosen[r]}', ${fb};`] : []),
      ...Object.keys(STEPS).filter((p) => chosen[`${r}:${p}`] !== undefined).map((p) => `${label} ${p}: ${STEPS[p][1].find(([, v]) => v === step(r, p))[0]}`),
    ]).join("\n") || "(the defaults)";
  }
  const panel = document.createElement("details");
  panel.className = "fontpick";
  panel.innerHTML = `<summary title="Fonts (temporary)">Aa</summary><div class="fp">` +
    ROLES.map(([role, label, list, def]) => `<div class="fp-role"><span>${label}</span><div class="fp-row">` +
      `<button type="button" data-step="-1" aria-label="Previous ${label.toLowerCase()} font">&lsaquo;</button>` +
      `<select data-role="${role}" aria-label="${label} font"><option value="">${def ? `Default (${def})` : "Same as text"}</option>` +
      TYPES.filter(([, fonts]) => fonts.some((f) => list.includes(f))).map(([type, fonts]) => `<optgroup label="${type}">` +
        fonts.map((f) => `<option${chosen[role] === f ? " selected" : ""}>${f}</option>`).join("") + `</optgroup>`).join("") + `</select>` +
      `<button type="button" data-step="1" aria-label="Next ${label.toLowerCase()} font">&rsaquo;</button></div><div class="fp-row">` +
      Object.entries(STEPS).filter(([prop]) => !(role === "chart" && prop === "spacing")).map(([prop, [name, steps]]) =>
        `<select data-role="${role}" data-prop="${prop}" aria-label="${label} ${prop}"><option value="">${name}</option>` +
        steps.map(([n, v]) => `<option value="${v}"${step(role, prop) === v ? " selected" : ""}>${n}</option>`).join("") + `</select>`).join("") +
      `</div></div>`).join("") +
    `<pre class="fp-css"></pre><button type="button" data-reset>Reset</button></div>`;
  const css = panel.querySelector(".fp-css");
  panel.addEventListener("change", (e) => {
    const { role, prop } = e.target.dataset;
    if (!role) return;
    const key = prop ? `${role}:${prop}` : role;
    if (e.target.value) chosen[key] = e.target.value; else delete chosen[key];
    save(chosen); apply();
  });
  // The arrows step the select next to them and wrap at the ends.
  panel.addEventListener("click", (e) => {
    const step = Number(e.target.closest("[data-step]")?.dataset.step);
    if (!step) return;
    const sel = e.target.closest(".fp-row").querySelector("select");
    const n = sel.options.length;
    sel.selectedIndex = (sel.selectedIndex + step + n) % n;
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  });
  panel.querySelector("[data-reset]").addEventListener("click", () => {
    for (const k of Object.keys(chosen)) delete chosen[k];
    for (const s of panel.querySelectorAll("select")) s.value = "";
    save(chosen); apply();
  });
  const style = document.createElement("style");
  style.textContent = `.fontpick { margin: 0; padding: 0; border: 0; position: fixed; right: 16px; bottom: 16px; z-index: var(--z-overlay); font: var(--fs-sm) var(--sans); }
.fontpick > summary { list-style: none; cursor: pointer; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink); font: 600 var(--fs-lg) var(--display); box-shadow: var(--float-sm); }
.fontpick > summary::-webkit-details-marker { display: none; }
details.fontpick > summary::before, details.fontpick[open] > summary::before { content: none; }
.fontpick .fp { position: absolute; right: 0; bottom: 48px; width: min(320px, calc(100vw - 32px)); display: grid; gap: var(--sp-10); padding: 14px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); box-shadow: var(--float); }
.fontpick .fp { box-sizing: border-box; width: 320px; max-width: calc(100vw - 32px); max-height: calc(100vh - 96px); overflow-y: auto; }
.fontpick .fp-role { display: grid; gap: var(--sp-4); color: var(--muted); height: 84px; }
.fontpick .fp-role > span { height: 20px; line-height: 20px; overflow: hidden; white-space: nowrap; }
.fontpick .fp-row { display: flex; gap: var(--sp-4); height: 28px; }
.fontpick select { flex: 1; min-width: 0; height: 28px; box-sizing: border-box; text-overflow: ellipsis; font: var(--fs-sm) var(--sans); padding: var(--sp-4) var(--sp-6); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: var(--r-tag); }
.fontpick .fp-css { height: 6em; overflow: auto; box-sizing: border-box; margin: 0; padding: var(--sp-8); font: var(--fs-xs) var(--mono); white-space: pre-wrap; background: var(--sunk); border-radius: var(--r-tag); color: var(--ink-2); }
.fontpick button { justify-self: start; font: var(--fs-sm) var(--sans); padding: 3px var(--sp-10); background: none; color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-tag); cursor: pointer; }
.fontpick .fp-row button { flex: none; width: 32px; height: 28px; box-sizing: border-box; padding: 0; text-align: center; font-size: var(--fs-lg); line-height: 1; }
@media (max-width: 720px) { .fontpick { display: none; } }`;
  document.head.append(style, adjusted);
  document.body.append(panel);
  apply();
</script>
</body>
</html>
