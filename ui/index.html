<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">

<title>aleph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="shell">
  <nav class="side" aria-label="Views">
    <a class="mark" href="#/">
      <!-- The small aleph mark: the outer circle and the point. The full mark has a third circle between them, too fine at this size. -->
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="12"/>
        <circle cx="35.5" cy="64.5" r="20" fill="currentColor"/>
      </svg>aleph</a>
    <div id="nav"></div>
    <button id="collapse" type="button" aria-label="Collapse the sidebar" title="Collapse the sidebar" aria-expanded="true">&lt;&lt;</button>
  </nav>
  <main>
    <p id="offline" role="alert" hidden>The server is unreachable. Showing the last data.</p>
    <div id="aged" hidden></div>
    <div id="stale" hidden></div>
    <div id="view"></div>
  </main>
</div>
<script>
  // A classic script, so that a collapsed sidebar is collapsed before the first paint. The key and the JSON value are keep()'s; the older "1"/"0" key still counts.
  {
    const KEY = "aleph.sidebar-collapsed", OLD = "aleph-sidebar-collapsed";
    const shell = document.querySelector(".shell"), button = document.getElementById("collapse");
    const show = (collapsed) => {
      shell.classList.toggle("collapsed", collapsed);
      button.textContent = collapsed ? ">>" : "<<";
      const label = collapsed ? "Expand the sidebar" : "Collapse the sidebar";
      button.setAttribute("aria-label", label);
      button.title = label;
      button.setAttribute("aria-expanded", String(!collapsed));
    };
    try { const v = localStorage.getItem(KEY); show(v === null ? localStorage.getItem(OLD) === "1" : JSON.parse(v) === true); } catch {}
    button.addEventListener("click", () => {
      const collapsed = !shell.classList.contains("collapsed");
      show(collapsed);
      try { localStorage.setItem(KEY, JSON.stringify(collapsed)); } catch {}
    });
  }
</script>

<p class="sr" role="status" aria-live="polite" id="copied"></p>
<script type="module">import { start } from "/views/lib/router.js"; start();</script>
<!-- The font picker, the theme picker, the annotations, the chat and the shelf dock button: the aleph-tools widgets, served at /vendor/dock/. One script each, so a missing file loses that widget only. The picker stays; only the user decides when it goes. -->
<script type="module">
  import { dock } from "/vendor/dock/dock.js";
  import { fontPicker, SANS, SERIF, MONO } from "/vendor/dock/font-picker.js";
  // The dock is made by the first widget: set its phone row layout before that.
  dock({ rowBelow: 720 });
  const role = (name, label, fonts, def, fallback, steps) => ({ name, label, fonts, default: def, fallback, steps });
  fontPicker({
    key: "aleph-fonts",
    hideBelow: 720,
    local: ["Hack Nerd Font"],
    roles: [
      role("display", "Titles", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"),
      role("metric", "Big numbers", [...SANS, ...SERIF], "Work Sans", "system-ui, sans-serif"),
      role("sans", "Text", SANS, "Work Sans", "system-ui, sans-serif"),
      role("num", "Numbers", [...SANS, ...MONO], "", "system-ui, sans-serif"),
      role("mono", "Code", MONO, "Hack Nerd Font", "ui-monospace, monospace"),
      role("brand", "Logo", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"),
      role("chart", "Charts", [...SANS, ...MONO], "", "system-ui, sans-serif", ["size", "weight"]),
    ],
  });
</script>
<script type="module">
  import { themePicker } from "/vendor/dock/theme-picker.js";
  // The palettes live in app.css under data-palette; Lavender is the default and sets none.
  themePicker({ key: "aleph-theme", base: "Lavender", themes: ["Dracula", "Iceberg", "Lavender", "Nightfox", "Nord", "Nord Aurora", "Nord Light", "Nordfox", "One", "Palenight Mild", "Palenightfall", "Poimandres", "Solarized", "Tokyo Night", "Tomorrow"] });
</script>
<script type="module">
  import { annotate, remote } from "/vendor/dock/annotate.js";
  // Notes live on the server, where `shelf note` lets an agent read, answer and add them. The page hears of a
  // change from the router's stream; a tab shown again loads them too.
  // `send` hands a note to a waiting agent through the shelf, which marks it sent.
  annotate({
    store: remote("/api/annotations", {
      headers: { "X-Aleph-UI": "1" },
      watch: (fn) => addEventListener("aleph:change", (e) => { if (e.detail.includes("/api/annotations")) fn(); }),
    }),
    send: (b) => fetch("/shelf/send", { method: "POST", headers: { "content-type": "application/json", "X-Aleph-UI": "1" }, body: JSON.stringify({ ...b, url: location.href }) }).then((r) => { if (!r.ok) throw r.status; return r.json(); }),
  });
</script>
<script type="module">
  import { shelf } from "/vendor/dock/shelf.js";
  shelf({ url: "/shelf/" });
</script>
<script type="module">
  import { chat } from "/vendor/dock/chat.js";
  // The chat agent (ui/chat-hooks.ts) gets the open notes of the page in view, named as annotate.js names a page, and
  // the notes its @ button points at.
  chat({
    headers: { "X-Aleph-UI": "1" },
    context: () => ({ page: location.origin + location.pathname + (/^#!?\//.test(location.hash) ? location.hash : "") }),
  });
</script>
</body>
</html>
