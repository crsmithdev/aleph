<body>
<div class="shell">
  <nav class="side" aria-label="Views">
    <a class="mark" href="#/">
      <!-- The small aleph mark: the outer circle and the point. The full mark has a third circle between them, too fine at this size. -->
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="12"/>
        <circle cx="35.5" cy="64.5" r="20" fill="currentColor"/>
      </svg>aleph</a>
    <div id="nav"></div>
    <a id="logout" href="#" title="Log out" hidden><wa-icon name="right-from-bracket" aria-hidden="true"></wa-icon><span class="lbl">Log out</span></a>
    <button id="collapse" type="button" aria-label="Collapse the sidebar" aria-expanded="true">&lt;&lt;</button>
  </nav>
  <main>
    <p id="offline" role="alert" hidden>The server is unreachable. Showing the last data.</p>
    <p id="aged" role="alert" hidden></p>
    <p id="stale" role="alert" hidden>The server runs older code than the checkout. Restart it: <code>systemctl --user restart aleph-ui</code></p>
    <div id="view"></div>
  </main>
</div>
<script>
  // A classic script, so that a collapsed sidebar is collapsed before the first paint. The key and the JSON value are keep()'s; the older "1"/"0" key still counts.
  {
    const KEY = "aleph.sidebar-collapsed", OLD = "aleph-sidebar-collapsed";
    const shell = document.querySelector(".shell"), button = document.getElementById("collapse");
    const show = (collapsed) => {
      shell.classList.toggle("collapsed", collapsed);
      button.textContent = collapsed ? ">>" : "<<";
      button.setAttribute("aria-label", collapsed ? "Expand the sidebar" : "Collapse the sidebar");
      button.setAttribute("aria-expanded", String(!collapsed));
    };
    try { const v = localStorage.getItem(KEY); show(v === null ? localStorage.getItem(OLD) === "1" : JSON.parse(v) === true); } catch {}
    button.addEventListener("click", () => {
      const collapsed = !shell.classList.contains("collapsed");
      show(collapsed);
      try { localStorage.setItem(KEY, JSON.stringify(collapsed)); } catch {}
    });
  }
</script>

<p class="sr" role="status" aria-live="polite" id="copied"></p>
<script type="module">import { start } from "/router.js"; start();</script>
<!-- The font picker and the annotations: copies of ~/kit (65aeec5). The picker stays; only Chris decides when it goes. -->
<script type="module">
  import { fontPicker, SANS, SERIF, MONO } from "/vendor/kit/font-picker.js";
  import { annotate, remote } from "/vendor/kit/annotate.js";
  const role = (name, label, fonts, def, fallback, steps) => ({ name, label, fonts, default: def, fallback, steps });
  fontPicker({
    key: "aleph-fonts",
    local: ["Hack Nerd Font"],
    roles: [
      role("display", "Titles", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"),
      role("metric", "Big numbers", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"),
      role("sans", "Text", SANS, "Work Sans", "system-ui, sans-serif"),
      role("num", "Numbers", [...SANS, ...MONO], "", "system-ui, sans-serif"),
      role("mono", "Code", MONO, "Hack Nerd Font", "ui-monospace, monospace"),
      role("brand", "Logo", [...SERIF, ...SANS], "Merriweather", "Georgia, serif"),
      role("chart", "Charts", [...SANS, ...MONO], "", "system-ui, sans-serif", ["size", "weight"]),
    ],
  });
  // Notes live on the server, where `aleph annotation` lets an agent read, answer and add them. The page hears of a
  // change from the router's stream; a tab shown again loads them too.
  annotate({ store: remote("/api/annotations", {
    headers: { "X-Aleph-UI": "1" },
    watch: (fn) => addEventListener("aleph:change", (e) => { if (e.detail.includes("/api/annotations")) fn(); }),
  }) });
</script>
</body>
</html>
